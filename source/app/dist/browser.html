<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Orbit Browser</title><link rel="stylesheet" href="browser.css"></head><body>
<div class="tabbar"><div id="tabs" role="tablist"></div><button id="new" title="New tab (Ctrl+T)" aria-label="New tab">+</button><div id="chat-controls"><button id="pdf-upload-status" hidden role="status" aria-live="polite"></button><button id="chat-reload" hidden title="Reload ChatGPT">↻ GPT</button><button id="chat" aria-pressed="false">ChatGPT</button></div></div>
<div id="error" role="status"></div><section id="empty" hidden><h1>PDF Reader</h1><p>Click + above to open a PDF.</p><p>Open ChatGPT to ask questions while reading.</p></section>
<dialog id="file-address-dialog"><form id="file-address-form"><h2>File address</h2><p id="file-address-title"></p><label for="file-address">View or edit the PDF path / URL</label><input id="file-address" autocomplete="off" required><p id="file-address-error" role="alert"></p><div class="dialog-actions"><button id="file-address-cancel" type="button">Cancel</button><button id="file-address-save" type="submit">Open</button></div></form></dialog>
<script src="browser.js"></script></body></html>

name: Sync site download statistics

on:
  schedule:
    - cron: '17,47 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-site-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check cumulative counting rules
        run: node --test source/site/update-stats.test.cjs
      - name: Update the cumulative download ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node source/site/update-stats.cjs --publish

name: Feedback or improvement
description: Suggest an improvement, share an idea, or report a problem.
title: "[Feedback] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Feature idea
        - Workflow or design improvement
        - Bug report
        - General feedback
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Describe the idea or problem and how it would improve your workflow.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit version
      placeholder: e.g. 1.8.6
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or supporting files
      description: Drag files into this field, or add links that help explain your feedback.

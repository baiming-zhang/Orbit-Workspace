<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src http: https:; connect-src http: https:;" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav id="tab-strip" hidden aria-label="申请栏目"></nav><button id="new-tab" hidden type="button"></button>

      <main id="app-main" class="app-main"></main>
    </div>

    <template id="browser-template">
      <section class="browser-surface">
        <div class="browser-toolbar">
          <button class="browser-button browser-back" type="button" title="后退">←</button>
          <button class="browser-button browser-forward" type="button" title="前进">→</button>
          <button class="browser-button browser-reload" type="button" title="刷新">↻</button>
          <div class="address-wrap">
            <span class="secure-dot" title="网页地址">●</span>
            <input class="address-input" type="text" spellcheck="false" aria-label="网址" />
          </div>
          <button class="browser-button browser-go" type="button">前往</button>
        </div>
        <div class="browser-status"></div>
        <webview class="application-webview" partition="persist:phd-applications" allowpopups></webview>
      </section>
    </template>

    <link rel="stylesheet" href="./orbit.css" />
    <link rel="stylesheet" href="./details.css" />
    <script src="./bridge.js"></script>
    <script src="./data.js"></script>
    <script src="./finance.js"></script>
    <script src="./plan.js"></script>
    <script src="./details.js"></script>
    <script src="./selection.js"></script>
    <script src="./columns.js"></script>
    <script src="./app.js"></script>
    <script src="./language.js"></script>
  </body>
</html>
